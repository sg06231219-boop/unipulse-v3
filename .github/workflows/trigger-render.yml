name: Deploy
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Render deploy
        env:
          RENDER_KEY: rnd_YRp3lawJR0ofKVFmbNqcSYuPvu5N
        run: |
          echo "=== POST /deploys with clearCache ==="
          curl -s -w "\nHTTP_CODE:%{http_code}" -X POST "https://api.render.com/v1/services/srv-d8j9j88jo6nc73e449ig/deploys" \
            -H "Authorization: Bearer $RENDER_KEY" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":true}'
          
          echo ""
          echo "=== Waiting 7 min ==="
          sleep 420
          
          echo "=== Deploy status ==="
          curl -s "https://api.render.com/v1/services/srv-d8j9j88jo6nc73e449ig/deploys?limit=3" \
            -H "Authorization: Bearer $RENDER_KEY" | python3 -c "
          import sys,json
          for d in json.load(sys.stdin):
              dep=d['deploy']
              print(f'commit={dep[\"commit\"][\"id\"][:8]} status={dep[\"status\"]} trigger={dep[\"trigger\"]} finished={dep.get(\"finishedAt\",\"running\")}')
          "
          
          echo "=== Verify ==="
          curl -s -w " HTTP%{http_code}" "https://unipulse-v3.onrender.com/robots.txt" | head -5
          echo ""
          curl -s "https://unipulse-v3.onrender.com/openapi.json" | python3 -c "
          import sys,json
          p=list(json.load(sys.stdin)['paths'].keys())
          print(f'Routes:{len(p)} SEO:{[x for x in p if \"robot\" in x or \"sitemap\" in x]}')
          "