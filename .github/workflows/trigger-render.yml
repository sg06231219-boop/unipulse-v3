name: Clean Deploy
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger clean deploy
        env:
          RENDER_KEY: rnd_YRp3lawJR0ofKVFmbNqcSYuPvu5N
        run: |
          echo "=== Triggering clean deploy (clearCache=true) ==="
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.render.com/v1/services/srv-d8j9j88jo6nc73e449ig/deploys" \
            -H "Authorization: Bearer $RENDER_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": true}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP $HTTP_CODE"
          echo "Response: $BODY"
          
          echo ""
          echo "=== Waiting 5 min for build ==="
          sleep 300
          
          echo "=== Checking deploy status ==="
          curl -s "https://api.render.com/v1/services/srv-d8j9j88jo6nc73e449ig/deploys?limit=3" \
            -H "Authorization: Bearer $RENDER_KEY" | python3 -c "
          import sys,json
          for d in json.load(sys.stdin):
              dep=d['deploy']
              print(f'commit={dep[\"commit\"][\"id\"][:8]} status={dep[\"status\"]} trigger={dep[\"trigger\"]} finished={dep.get(\"finishedAt\",\"N/A\")}')
          "
          
          echo ""
          echo "=== Verify SEO ==="
          curl -s -w "\nHTTP %{http_code}" "https://unipulse-v3.onrender.com/robots.txt"
          echo ""
          curl -s -w "\nHTTP %{http_code}" "https://unipulse-v3.onrender.com/openapi.json" | python3 -c "
          import sys,json
          data=sys.stdin.read()
          http_line=data.strip().split('\n')[-1]
          body='\n'.join(data.strip().split('\n')[:-1])
          print(http_line)
          try:
              paths=list(json.loads(body)['paths'].keys())
              print(f'Total routes: {len(paths)}')
              seo=[p for p in paths if 'robot' in p or 'sitemap' in p]
              print(f'SEO routes: {seo}')
          except:
              print('Parse error')
          "