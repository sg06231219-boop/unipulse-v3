name: Debug Render
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Get service details
        env:
          RENDER_KEY: rnd_YRp3lawJR0ofKVFmbNqcSYuPvu5N
        run: |
          SERVICE_ID="srv-d8j9j88jo6nc73e449ig"
          
          echo "=== Full service info ==="
          curl -s "https://api.render.com/v1/services/$SERVICE_ID" \
            -H "Authorization: Bearer $RENDER_KEY" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          s=d.get('service',d)
          print(json.dumps(s, indent=2))
          "
          
          echo ""
          echo "=== Latest deploy full detail ==="
          LATEST=$(curl -s "https://api.render.com/v1/services/$SERVICE_ID/deploys?limit=1" \
            -H "Authorization: Bearer $RENDER_KEY" | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['deploy']['id'])")
          
          curl -s "https://api.render.com/v1/services/$SERVICE_ID/deploys/$LATEST" \
            -H "Authorization: Bearer $RENDER_KEY" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          print(json.dumps(d, indent=2))
          "
          
          echo ""
          echo "=== Try POST deploy without body ==="
          curl -s -w "\nHTTP:%{http_code}" -X POST "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_KEY" \
            -H "Accept: application/json"
          
          echo ""
          echo "=== Try POST with imgCommitId ==="
          HEAD_SHA=$(curl -s "https://api.github.com/repos/sg06231219-boop/unipulse-v3/commits/main" | python3 -c "import sys,json;print(json.load(sys.stdin)['sha'])")
          curl -s -w "\nHTTP:%{http_code}" -X POST "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"imgCommitId\":\"$HEAD_SHA\"}"