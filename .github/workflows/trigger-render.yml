name: Render Fix
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Suspend autoDeploy and trigger manual deploy
        env:
          RENDER_KEY: rnd_YRp3lawJR0ofKVFmbNqcSYuPvu5N
        run: |
          SERVICE_ID="srv-d8j9j88jo6nc73e449ig"
          
          # 1. Suspend autoDeploy
          echo "=== Suspending autoDeploy ==="
          curl -s -X PATCH "https://api.render.com/v1/services/$SERVICE_ID" \
            -H "Authorization: Bearer $RENDER_KEY" \
            -H "Content-Type: application/json" \
            -d '{"autoDeploy":"no"}' | python3 -c "import sys,json;d=json.load(sys.stdin);print(f'autoDeploy={d.get(\"autoDeploy\",\"?\")}')" 2>/dev/null || echo "PATCH failed"
          
          sleep 5
          
          # 2. Check latest commit
          HEAD_SHA=$(curl -s "https://api.github.com/repos/sg06231219-boop/unipulse-v3/commits/main" | python3 -c "import sys,json;print(json.load(sys.stdin)['sha'])")
          echo "HEAD_SHA=$HEAD_SHA"
          
          # 3. Trigger manual deploy
          echo "=== Triggering manual deploy ==="
          curl -s -X POST "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"imgCommitId\":\"$HEAD_SHA\"}" | python3 -c "import sys,json;d=json.load(sys.stdin);print(f'deploy_id={d.get(\"id\",\"?\")} status={d.get(\"status\",\"?\")}')" 2>/dev/null || echo "POST failed"
          
          # 4. Wait and poll
          echo "Waiting 5 min for build..."
          sleep 300
          
          # 5. Check status
          echo "=== Final status ==="
          curl -s --max-time 10 "https://api.render.com/v1/services/$SERVICE_ID/deploys?limit=3" \
            -H "Authorization: Bearer $RENDER_KEY" | python3 -c "
          import sys,json
          for d in json.load(sys.stdin):
              dep=d['deploy']
              print(f'{dep[\"commit\"][\"id\"][:8]} status={dep[\"status\"]} finished={dep.get(\"finishedAt\",\"running\")}')
          "
          echo '---'
          curl -s --max-time 15 -w " HTTP%{http_code}" "https://unipulse-v3.onrender.com/robots.txt" | tail -3
          echo ""
          curl -s --max-time 15 "https://unipulse-v3.onrender.com/api/health" | head -c 200
          echo ""
          curl -s --max-time 15 "https://unipulse-v3.onrender.com/openapi.json" | python3 -c "import sys,json;p=list(json.load(sys.stdin)['paths'].keys());print(f'Routes:{len(p)} SEO:{[x for x in p if \"robot\" in x or \"sitemap\" in x]}')" 2>/dev/null || echo "OpenAPI: ERR"