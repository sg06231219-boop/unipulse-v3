<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniPulse · 高考志愿智能助手</title>
  <meta name="description" content="覆盖1457所中国高校，真实省分数线，AI智能选校，志愿表管理">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="stylesheet" href="/static/css/style_v4.css?v=4.0.0">
</head>
<body>
  <!-- 顶部导航 -->
  <nav class="topnav">
    <div class="container nav-inner">
      <a href="#" data-page="home" class="nav-brand">🎓 UniPulse</a>
      <div class="nav-links" id="navLinks">
        <a href="#" data-page="universities">高校库</a>
        <a href="#" data-page="programs">专业</a>
        <a href="#" data-page="forum">讨论区</a>
        <a href="#" data-page="compare">对比</a>
        <a href="#" data-page="ai-report">AI选校</a>
      </div>
      <div class="nav-actions">
        <input type="text" id="globalSearch" class="nav-search" placeholder="搜索高校/专业 (按/聚焦)">
        <a href="#" data-page="wish-table" class="btn btn-sm btn-ghost" style="position:relative">
          📋 志愿表 <span id="wishBadge" class="wish-badge" style="display:none">0</span>
        </a>
        <a href="#" data-page="favorites" class="btn btn-sm btn-ghost">⭐ 收藏</a>
      </div>
      <button class="btn btn-ghost mobile-toggle" id="mobileToggle">☰</button>
    </div>
  </nav>

  <main class="main-content">
    <!-- ═══ 首页 ═══ -->
    <div id="page-home" class="page">
      <!-- Hero -->
      <div class="hero">
        <div class="container">
          <div class="hero-search-wrap">
            <h1 class="hero-title">输入分数，智能选校</h1>
            <p class="hero-sub">覆盖 1457 所高校 · 真实省分数线 · AI志愿推荐</p>
            <div class="hero-search">
              <input type="number" id="heroSearch" class="hero-input" placeholder="输入你的高考分数" min="300" max="750">
              <button id="heroSearchBtn" class="btn btn-primary hero-btn">搜索</button>
            </div>
            <div class="quick-tags">
              <button class="quick-tag" data-score="650">650+</button>
              <button class="quick-tag" data-score="600">600+</button>
              <button class="quick-tag" data-score="550">550+</button>
              <button class="quick-tag" data-score="500">500+</button>
              <button class="quick-tag" data-score="450">450+</button>
            </div>
            <div id="heroStats" class="hero-stats"></div>
          </div>
        </div>
      </div>

      <!-- 热门高校 -->
      <section class="container section">
        <div class="section-header">
          <h2 class="section-title">🔥 热门高校</h2>
          <a href="#" data-page="universities" class="section-more">查看全部 →</a>
        </div>
        <div id="hotUnis" class="uni-grid"></div>
      </section>

      <!-- 分数段分布 -->
      <section class="container section">
        <div class="section-header">
          <h2 class="section-title">📊 分数段分布</h2>
        </div>
        <div id="scoreDistChart"></div>
      </section>

      <!-- 热门专业 -->
      <section class="container section">
        <div class="section-header">
          <h2 class="section-title">📚 热门专业</h2>
          <a href="#" data-page="programs" class="section-more">查看全部 →</a>
        </div>
        <div id="programGrid" class="program-grid"></div>
      </section>

      <!-- 讨论区预览 -->
      <section class="container section">
        <div class="section-header">
          <h2 class="section-title">💬 讨论区</h2>
          <a href="#" data-page="forum" class="section-more">更多 →</a>
        </div>
        <div id="forumPreview"></div>
      </section>
    </div>

    <!-- ═══ 高校库 ═══ -->
    <div id="page-universities" class="page hidden">
      <div class="container">
        <div class="page-header">
          <h1>高校库 <span id="uniCount" class="text-gray">共 0 所</span></h1>
        </div>
        <!-- 分数滑块 -->
        <div class="filter-bar" style="margin-bottom:16px">
          <label>你的分数：<span id="scoreDisplay">550</span></label>
          <input type="range" id="scoreSlider" min="300" max="750" value="550" style="width:200px">
          <button id="scoreFilterBtn" class="btn btn-sm btn-primary">应用</button>
        </div>
        <!-- 筛选栏 -->
        <div class="filter-bar">
          <input type="text" id="uniSearch" class="filter-input" placeholder="搜索高校名/省份">
          <select id="filterRegion" class="filter-select"><option value="">全部地区</option><option>华北</option><option>华东</option><option>华中</option><option>华南</option><option>西南</option><option>西北</option><option>东北</option></select>
          <select id="filterLevel" class="filter-select"><option value="">全部层次</option><option value="985">985</option><option value="211">211</option><option value="双一流">双一流</option></select>
          <select id="filterType" class="filter-select"><option value="">全部类型</option><option>综合</option><option>理工</option><option>师范</option><option>医药</option><option>财经</option><option>政法</option><option>语言</option><option>农林</option><option>艺术</option><option>军事</option></select>
          <select id="filterChance" class="filter-select"><option value="">冲稳保</option><option value="冲">冲一冲</option><option value="稳">稳一稳</option><option value="保">保一保</option></select>
          <select id="sortUni" class="filter-select"><option value="rank-asc">排名↑</option><option value="score-desc">分数线↓</option><option value="salary-desc">薪资↓</option><option value="employment-desc">就业率↓</option></select>
          <button id="clearFilters" class="btn btn-sm btn-ghost">清除</button>
        </div>
        <div id="uniResultsInfo" style="margin:8px 0;font-size:14px;color:var(--gray-400)"></div>
        <div id="uniGrid" class="uni-grid"></div>
      </div>
    </div>

    <!-- ═══ 高校详情 ═══ -->
    <div id="page-uni-detail" class="page hidden">
      <div class="container" id="uniDetailContent">
        <div class="loading-skeleton"></div>
      </div>
    </div>

    <!-- ═══ 专业 ═══ -->
    <div id="page-programs" class="page hidden">
      <div class="container">
        <div class="page-header"><h1>专业大全</h1></div>
        <div id="programGridFull" class="program-grid"></div>
      </div>
    </div>

    <!-- ═══ 专业详情 ═══ -->
    <div id="page-program-detail" class="page hidden">
      <div class="container" id="programDetailContent"></div>
    </div>

    <!-- ═══ 讨论区 ═══ -->
    <div id="page-forum" class="page hidden">
      <div class="container">
        <div class="page-header" style="display:flex;justify-content:space-between;align-items:center">
          <h1>讨论区</h1>
          <button id="newPostBtn" class="btn btn-primary">✏️ 发帖</button>
        </div>
        <div id="forumList"></div>
      </div>
    </div>

    <!-- ═══ 帖子详情 ═══ -->
    <div id="page-post-detail" class="page hidden">
      <div class="container" id="postDetailContent"></div>
    </div>

    <!-- ═══ 对比 ═══ -->
    <div id="page-compare" class="page hidden">
      <div class="container">
        <div class="page-header"><h1>院校对比</h1></div>
        <div id="compareContent"></div>
      </div>
    </div>

    <!-- ═══ 志愿表 ═══ -->
    <div id="page-wish-table" class="page hidden">
      <div class="container" id="wishTableContent"></div>
    </div>

    <!-- ═══ AI选校 ═══ -->
    <div id="page-ai-report" class="page hidden">
      <div class="container">
        <div class="page-header"><h1>🤖 AI 智能选校</h1></div>
        <div class="ai-form">
          <div class="form-row">
            <label class="form-label">高考分数</label>
            <input type="number" id="aiScore" class="form-input" placeholder="300-750" min="300" max="750">
          </div>
          <div class="form-row">
            <label class="form-label">省份</label>
            <select id="aiProvince" class="form-select"><option value="">选择省份</option></select>
          </div>
          <div class="form-row">
            <label class="form-label">科类</label>
            <select id="aiType" class="form-select"><option value="理科">理科</option><option value="文科">文科</option><option value="综合">综合改革</option></select>
          </div>
          <div class="form-row">
            <label class="form-label">意向专业</label>
            <input type="text" id="aiMajor" class="form-input" placeholder="如：计算机科学与技术">
          </div>
          <button id="aiGenerate" class="btn btn-primary" style="width:100%;margin-top:16px">生成选校报告</button>
        </div>
        <div id="aiReportContent" style="margin-top:20px"></div>
      </div>
    </div>

    <!-- ═══ 收藏 ═══ -->
    <div id="page-favorites" class="page hidden">
      <div class="container" id="favoritesContent"></div>
    </div>
  </main>

  <!-- 发帖弹窗 -->
  <div id="newPostModal" class="modal hidden">
    <div class="modal-overlay" data-close-modal></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3>发帖</h3>
        <button data-close-modal class="btn btn-ghost btn-sm">✕</button>
      </div>
      <div class="form-row"><input type="text" id="postTitle" class="form-input" placeholder="标题"></div>
      <div class="form-row"><textarea id="postContent" class="form-input" rows="5" placeholder="内容"></textarea></div>
      <div class="form-row"><input type="text" id="postTags" class="form-input" placeholder="标签（逗号分隔）"></div>
      <button id="submitPost" class="btn btn-primary" style="width:100%">发布</button>
    </div>
  </div>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="container">
      <p>UniPulse v4.0 · 高考志愿智能助手 · 数据来源：gaokao.cn</p>
    </div>
  </footer>

  <script src="/static/js/app_v4.js?v=4.0.0"></script>
</body>
</html>
